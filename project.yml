name: GiaHaiPatch
options:
  bundleIdPrefix: com.giahai
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  GiaHaiPatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GiaHaiPatchApp.swift
      - Models.swift
      - PatchStore.swift
      - ContentView.swift
      - LaunchScreen.storyboard
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giahai.patch
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        UILAUNCHSTORYBOARDNAME: LaunchScreen
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: ZIPFoundation
