name: Build GiaHaiPatch IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project GiaHaiPatch.xcodeproj -scheme GiaHaiPatch

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project GiaHaiPatch.xcodeproj \
            -scheme GiaHaiPatch \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/GiaHaiPatch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/GiaHaiPatch.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry GiaHaiPatch.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GiaHaiPatch-IPA
          path: ${{ runner.temp }}/GiaHaiPatch.ipa
          if-no-files-found: error
